[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MISTGATE"
version = "0.2.0"
description = "MIST-GATE for robust spatial multi-omics integration and domain identification"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8,<3.11"
license = { text = "MIT" }
authors = [{ name = "MIST-GATE contributors" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.8",
    "Operating System :: OS Independent"
]
dependencies = [
    "tensorflow==2.13.1",
    "scikit-learn>=1.0.2",
    "pandas>=1.3.5",
    "scanpy>=1.9.3",
    "jupyterlab>=3.6.7",
    "tqdm>=4.66.2",
    "matplotlib>=3.5.3",
    "networkx>=2.6",
    "pybedtools>=0.9.0",
    "seaborn>=0.12.2",
    "numpy>=1.22,<1.25",
    "scipy>=1.7.3",
    "nvidia-ml-py3>=7.352.0", 
    "gseapy>=1.0.4",
    "python-igraph>=0.10",
    "leidenalg>=0.10",
    "louvain>=0.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "twine>=4.0.2"
]

[tool.setuptools.packages.find]
include = ["MISTGATE", "MISTGATE.*", "MultiGATE"]
